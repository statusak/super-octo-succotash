services:
  # ─────────────────────────── Инфраструктура обмена сообщениями ───────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: eventapi-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SESSION_TIMEOUT_MS: 5000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: eventapi-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
  # ─────────────────────────── Базы данных (по одной на сервис) ───────────────────────────
  users-db:
    image: postgres:16
    container_name: eventapi-users-db
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  events-db:
    image: postgres:16
    container_name: eventapi-events-db
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - events-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  bookings-db:
    image: postgres:16
    container_name: eventapi-bookings-db
    environment:
      POSTGRES_DB: bookings
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - bookings-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: eventapi-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  events-service:
    build:
      context: .
      dockerfile: Events.Service/Dockerfile
      network: host
      args:
        HTTP_PROXY: "http://192.168.57.4:8118"
        HTTPS_PROXY: "http://192.168.57.4:8118"

    container_name: eventapi-events-service
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      # База данных
      ConnectionStrings__DefaultConnection: "Host=events-db;Port=5432;Database=events;Username=postgres;Password=postgres"
      
      # Kafka (важно: внутренний порт 29092, а не 9092)
      ConnectionStrings__BootstrapServers: "kafka:29092"
      
      # Redis
      Redis__Servers: "redis:6379"
      Redis__ConnectTimeout: 5000
      Redis__SyncTimeout: 3000
      Redis__AbortOnConnectFail: "false"
      Redis__ExpiryEventByIdMinutes: 10
      Redis__ExpiryTop10EventsMinutes: 1

      # JWT (если нужно переопределить в Docker)
      JwtSettings__Secret: "super-secret-key-change-in-production-at-least-32-chars-long!"
      JwtSettings__Issuer: "https://super-octo-succotash.com"
      JwtSettings__Audience: "https://super-octo-succotash.com"
      JwtSettings__ExpirationMinutes: 10

      # Логирование и AllowedHosts при необходимости
      Logging__LogLevel__Default: "Information"
      AllowedHosts: "*"
    depends_on:
      events-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  bookings-service:
    build:
      context: .
      dockerfile: Bookings.Service/Dockerfile
      network: host
      args:
        HTTP_PROXY: "http://192.168.57.4:8118"
        HTTPS_PROXY: "http://192.168.57.4:8118"

    container_name: eventapi-bookings-service
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      # База данных
      ConnectionStrings__DefaultConnection: "Host=bookings-db;Port=5432;Database=bookings;Username=postgres;Password=postgres"
      
      # Kafka (важно: внутренний порт 29092, а не 9092)
      ConnectionStrings__BootstrapServers: "kafka:29092"
    
      # JWT (если нужно переопределить в Docker)
      JwtSettings__Secret: "super-secret-key-change-in-production-at-least-32-chars-long!"
      JwtSettings__Issuer: "https://super-octo-succotash.com"
      JwtSettings__Audience: "https://super-octo-succotash.com"
      JwtSettings__ExpirationMinutes: 10

      # Логирование и AllowedHosts при необходимости
      Logging__LogLevel__Default: "Information"
      AllowedHosts: "*"
    depends_on:
      bookings-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  users-service:
    build:
      context: .
      dockerfile: Identity.Service/Dockerfile
      network: host
      args:
        HTTP_PROXY: "http://192.168.57.4:8118"
        HTTPS_PROXY: "http://192.168.57.4:8118"

    container_name: eventapi-identity-service
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      # База данных
      ConnectionStrings__DefaultConnection: "Host=users-db;Port=5432;Database=users;Username=postgres;Password=postgres"
    
      # JWT (если нужно переопределить в Docker)
      JwtSettings__Secret: "super-secret-key-change-in-production-at-least-32-chars-long!"
      JwtSettings__Issuer: "https://super-octo-succotash.com"
      JwtSettings__Audience: "https://super-octo-succotash.com"
      JwtSettings__ExpirationMinutes: 10

      # Логирование и AllowedHosts при необходимости
      Logging__LogLevel__Default: "Information"
      AllowedHosts: "*"
    depends_on:
      users-db:
        condition: service_healthy
    restart: unless-stopped


volumes:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
  users-db-data:
  events-db-data:
  bookings-db-data:
